<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <title>うちの子フード検索</title>
</head>

<body>
  <h1>🐾 うちの子フード検索</h1>

  <p>犬や猫のフードを原材料から探せるサイト</p>

  <button id="dogButton">犬</button>
<button id="catButton">猫</button>

  <h2>避けたい原材料</h2>

  <label>
    <input type="checkbox" value="鶏肉">
鶏肉

  </label>

  <label>
    <input type="checkbox" value="牛肉">
牛肉
  </label>

  <label>
    <input type="checkbox" value="小麦">
小麦
  </label>

  <br><br>
<br><br>

<h2>今食べているフード</h2>

<select id="currentFood">
  <option value="">フードを選択してください</option>
</select>

<button id="searchButton">検索する</button>
 
<div id="results"></div>

<div id="sampleFoods">
  <h2>サンプルフード</h2>

  <div class="food-card">
    <h3>サンプルフードA</h3>
    <p>🐾 犬用</p>
    <p>原材料：鶏肉・米・小麦</p>
    <p>メーカー：サンプルメーカー</p>
    <p><a href="#" target="_blank">商品ページを見る</a></p>
  </div>

  <div class="food-card">
    <h3>サンプルフードB</h3>
    <p>🐾 犬用</p>
    <p>原材料：魚・米</p>
    <p>メーカー：サンプルメーカー</p>
    <p><a href="#" target="_blank">商品ページを見る</a></p>
  </div>
</div>

<div id="searchResults"></div>
  
  <script src="script.js"></script> 
</body>
</html>
