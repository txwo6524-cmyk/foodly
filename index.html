<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <title>うちの子フード検索</title>
</head>

<body>
  <h1>🐾 うちの子フード検索</h1>

  <p>犬や猫のフードを原材料から探せるサイト</p>

  <div class="animal-switch">
  <button id="dogButton">🐶 犬用</button>
  <button id="catButton">🐱 猫用</button>
</div>
<button id="favoritesButton">★ お気に入り</button>

<div id="favoritesResults"></div>
  <div id="searchSection">
<h2>避けたい原材料</h2>

<div class="ingredient-category">
  <h3>🥩 肉・魚・卵</h3>

  <label><input type="checkbox" value="牛肉"> 牛肉</label>
  <label><input type="checkbox" value="鶏肉"> 鶏肉</label>
  <label><input type="checkbox" value="豚肉"> 豚肉</label>
  <label><input type="checkbox" value="羊肉"> 羊肉</label>
  <label><input type="checkbox" value="鹿肉"> 鹿肉</label>
  <label><input type="checkbox" value="魚"> 魚</label>
  <label><input type="checkbox" value="魚介類"> 魚介類</label>
  <label><input type="checkbox" value="卵"> 卵</label>
</div>

<div class="ingredient-category">
  <h3>🥛 乳製品</h3>

  <label><input type="checkbox" value="牛乳"> 牛乳</label>
  <label><input type="checkbox" value="チーズ"> チーズ</label>
</div>

<div class="ingredient-category">
  <h3>🌾 穀物</h3>

  <label><input type="checkbox" value="小麦"> 小麦</label>
  <label><input type="checkbox" value="米"> 米</label>
  <label><input type="checkbox" value="トウモロコシ"> トウモロコシ</label>
  <label><input type="checkbox" value="大麦"> 大麦</label>
  <label><input type="checkbox" value="オーツ麦"> オーツ麦</label>
</div>

<div class="ingredient-category">
  <h3>🫘 豆類</h3>

  <label><input type="checkbox" value="大豆"> 大豆</label>
  <label><input type="checkbox" value="エンドウ豆"> エンドウ豆</label>
  <label><input type="checkbox" value="ひよこ豆"> ひよこ豆</label>
  <label><input type="checkbox" value="レンズ豆"> レンズ豆</label>
</div>

<div class="ingredient-category">
  <h3>🥕 野菜・いも類</h3>

  <label><input type="checkbox" value="じゃがいも"> じゃがいも</label>
  <label><input type="checkbox" value="さつまいも"> さつまいも</label>
  <label><input type="checkbox" value="にんじん"> にんじん</label>
  <label><input type="checkbox" value="かぼちゃ"> かぼちゃ</label>
  <label><input type="checkbox" value="トマト"> トマト</label>
  <label><input type="checkbox" value="ほうれん草"> ほうれん草</label>
  <label><input type="checkbox" value="ブロッコリー"> ブロッコリー</label>
  <label><input type="checkbox" value="キャベツ"> キャベツ</label>
</div>

    <br><br>

  <button id="ingredientSearchButton">検索する</button>

  <div id="searchResults"></div>
  </div>  
<br><br>

<h2>今食べているフード</h2>

<select id="currentFood">
  <option value="">フードを選択してください</option>
</select>

 
<div id="results"></div>
  
  <script src="script.js"></script> 
</body>
</html>
